name: release-container

on:
  pull_request:
    paths:
      - "README.md"
      - "Formula/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  policy:
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Require the single PlanQ formula
        shell: bash
        run: |
          set -euo pipefail
          test -f Formula/planq.rb
          test "$(find Formula -type f | sort)" = "Formula/planq.rb"
          ! find Formula -type l | grep .
      - name: Validate public README
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's#.*releases/download/v\([^/]*\)/.*#\1#p' Formula/planq.rb)"
          test -n "${version}"
          grep -F 'https://planq.dev/docs/' README.md
          grep -F 'https://planq.dev/docs/install' README.md
          grep -F "Current formula version: \`${version}\`." README.md
          ! grep -F 'not available yet' README.md
      - name: Audit formula
        shell: bash
        run: |
          set -euo pipefail
          brew tap --custom-remote planq-cli/tap "file://${GITHUB_WORKSPACE}"
          brew trust planq-cli/tap
          brew audit --strict --formula --tap planq-cli/tap
