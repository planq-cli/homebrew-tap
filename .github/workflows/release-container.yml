name: release-container

on:
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  policy:
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Require the single PlanQ formula
        shell: bash
        run: |
          set -euo pipefail
          test -f Formula/planq.rb
          test "$(find Formula -type f | sort)" = "Formula/planq.rb"
          ! find Formula -type l | grep .
      - name: Audit formula
        run: brew audit --strict --formula Formula/planq.rb
